<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1118">
<title>카이로아</title>
<style>
:root{--bg:#0a1118;--panel:rgba(16,26,36,.92);--line:rgba(255,255,255,.22);--fg:#eef4f8;--accent:#e9b64f;
 --font:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Nanum Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);
 overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;touch-action:none;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud>*{position:absolute;pointer-events:auto;touch-action:none}
.btn{border:2px solid var(--line);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),rgba(20,32,44,.78));
 color:var(--fg);font:600 12px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer}
.btn svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:active,.btn.on{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),rgba(233,182,79,.6))}
.btn[disabled]{opacity:.45}
#btn-attack svg{width:52%;height:52%}
#cd{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(0,0,0,.55);border-radius:0 0 50% 50%;pointer-events:none}
#ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);pointer-events:none}
#ring circle{fill:none;stroke-width:3.5}
#joy{border-radius:50%;background:rgba(255,255,255,.07);border:2px solid var(--line)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#fff,#9ab);opacity:.8;pointer-events:none}
.pt{border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:3px;font:600 11px var(--font);
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer}
.pt.active{border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
.pt.down{opacity:.4}
.pt .nm{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:clip}
.pt .gem{width:16px;height:16px;transform:rotate(45deg) scale(.8);border-radius:3px}
.bar{width:100%;height:7px;background:rgba(0,0,0,.6);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#4cd37a;width:100%}
#minimap{border:2px solid var(--line);border-radius:12px;background:#0007;overflow:hidden;padding:0}
#minimap canvas{width:100%;height:100%;display:block}
#toast{left:50%;top:10px;transform:translateX(-50%);pointer-events:none!important;background:var(--panel);padding:6px 16px;border-radius:20px;opacity:0;transition:opacity .4s}
#toast.show{opacity:1}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:5}
#over.show{display:flex}
#menu{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
 padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#menu.show{display:flex}
#panel{width:min(100%,720px);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;touch-action:pan-y;user-select:text}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mb{min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.08);color:var(--fg);font:600 15px var(--font);cursor:pointer}
.mb.sel{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.list>div{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.list .grow{flex:1}
input[type=text]{min-height:44px;font:16px var(--font);padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:#0006;color:var(--fg);width:min(100%,260px);user-select:text;-webkit-user-select:text}
h3{margin:4px 0 8px;font-size:16px}
.muted{opacity:.7;font-size:13px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <button id="minimap" data-ui="map" aria-label="지도"><canvas width="84" height="84"></canvas></button>
  <button id="pause" class="btn" data-cmd="menu.toggle" aria-label="일시정지"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  <div id="toast"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="attack" class="btn game" data-cmd="combat.attack" aria-label="공격"><svg viewBox="0 0 24 24"><path d="M5 19L17 7M14 4h6v6M5 19l-1 1M8 16l-2-2"/></svg><span>공격</span></button>
  <button id="skill" class="btn game" data-cmd="combat.skill" aria-label="원소 기술"><div id="cd"></div><svg viewBox="0 0 24 24"><path d="M12 3c4 4 6 7 3 11-2 3-6 3-7 0 2 1 4 0 4-3-3 1-5-1-3-4 1-2 2-3 3-4z"/></svg><span>기술</span></button>
  <button id="burst" class="btn game" data-cmd="combat.burst" aria-label="필살기"><svg viewBox="0 0 24 24"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg><span>필살</span></button>
  <button id="sprint" class="btn game" data-cmd="player.sprint" aria-label="질주"><svg id="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,.15)"/><circle id="ringv" cx="50" cy="50" r="46" stroke="#7fe3a8" stroke-dasharray="289" stroke-dashoffset="0"/></svg><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg><span>질주</span></button>
  <button id="interact" class="btn game" data-cmd="world.interact" aria-label="상호작용"><svg viewBox="0 0 24 24"><path d="M5 11h14v9H5zM7 11V8a5 5 0 0 1 10 0v3M12 15v2"/></svg><span>열기</span></button>
  <button id="p0" class="pt" data-cmd="party.switch" data-index="0"></button>
  <button id="p1" class="pt" data-cmd="party.switch" data-index="1"></button>
  <button id="p2" class="pt" data-cmd="party.switch" data-index="2"></button>
  <button id="p3" class="pt" data-cmd="party.switch" data-index="3"></button>
</div>
<div id="over"><button class="mb" data-cmd="game.respawn">전원 쓰러짐 - 부활하기</button></div>
<div id="menu"><div id="panel"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
